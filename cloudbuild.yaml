steps:
  # Build the Docker image with build args
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/partyscout-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/partyscout-frontend:latest'
      - '.'

  # Push both tags so prod can promote :latest without rebuilding
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/partyscout-frontend']

  # Deploy to canary (us-east1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'partyscout-frontend-canary'
      - '--image'
      - 'gcr.io/$PROJECT_ID/partyscout-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _VITE_API_URL: 'https://partyscout.live'
  _VITE_FIREBASE_API_KEY: 'AIzaSyDiWsJLElP6j6bxJXdd6zWr3JsnpzAJHv0'
  _VITE_FIREBASE_AUTH_DOMAIN: 'bionic-upgrade-485121-h5.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: 'bionic-upgrade-485121-h5'
  _VITE_FIREBASE_STORAGE_BUCKET: 'bionic-upgrade-485121-h5.firebasestorage.app'
  _VITE_FIREBASE_MESSAGING_SENDER_ID: '869352526308'
  _VITE_FIREBASE_APP_ID: '1:869352526308:web:fdb2b9c9724319eb9b37f1'

images:
  - 'gcr.io/$PROJECT_ID/partyscout-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/partyscout-frontend:latest'
