name: Deploy Frontend to Cloud Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
  BACKEND_URL: ${{ secrets.BACKEND_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Storage
        run: |
          # Sync build output to bucket
          gsutil -m rsync -r -d dist gs://$BUCKET_NAME

          # Set cache headers for static assets (1 year)
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
            "gs://$BUCKET_NAME/assets/**"

          # Set no-cache for index.html (always fetch latest)
          gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" \
            "gs://$BUCKET_NAME/index.html"

      - name: Invalidate CDN Cache (if using Cloud CDN)
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ secrets.URL_MAP_NAME }} \
            --path "/*" \
            --async || echo "No CDN configured, skipping invalidation"
        continue-on-error: true

      - name: Output deployment URL
        run: |
          echo "Frontend deployed to: https://storage.googleapis.com/$BUCKET_NAME/index.html"
          echo "Or your custom domain if configured"
