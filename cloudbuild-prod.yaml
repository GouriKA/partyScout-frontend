steps:
  # Promote the canary :latest image to prod — no rebuild
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'partyscout-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/partyscout-frontend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'

options:
  logging: CLOUD_LOGGING_ONLY
